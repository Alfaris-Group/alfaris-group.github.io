<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfaris Labs – Apps</title>
<meta name="description" content="Alfaris Labs – useful apps, built with sincerity. Download Noor prayer times and more.">
<meta name="theme-color" content="#0b1530">
<link rel="icon" href="icons/noor.png">
<style>
:root{--bg1:#080d20;--bg2:#12204a;--card:#0f1836cc;--line:#ffffff1f;--gold:#f2c14e;--green:#16a56f;--txt:#f3f6ff;--dim:#a9b4d3}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans",sans-serif;color:var(--txt);background:linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 26px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#0f3d3e,#1b6b5a);display:grid;place-items:center}
.logo svg{width:30px;height:30px}
.bn{font-weight:800;font-size:19px;color:var(--gold);letter-spacing:.2px}
.sub{font-size:12px;color:var(--dim)}
.lang{display:flex;gap:6px}
.lang button{background:#ffffff14;border:1px solid var(--line);color:var(--txt);padding:6px 11px;border-radius:999px;font-size:13px;cursor:pointer}
.lang button.on{background:var(--gold);color:#201700;border-color:var(--gold);font-weight:700}
.hero{text-align:center;padding:18px 0 28px}
.hero h1{font-size:clamp(26px,6vw,40px);line-height:1.2;margin-bottom:10px}
.hero p{color:var(--dim);max-width:560px;margin:0 auto}
.grid{display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(8px)}
.top{display:flex;gap:16px;align-items:center}
.ic{width:84px;height:84px;border-radius:20px;flex:none;background:#ffffff12;display:grid;place-items:center;font-size:42px;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
h2{font-size:21px}
.meta{font-size:13px;color:var(--dim);margin-top:2px}
.desc{margin:14px 0;color:#dde4fb}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dl{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:14px;font-size:16px;box-shadow:0 6px 18px #16a56f44}
.dl:active{transform:scale(.98)}
.ghost{background:#ffffff14;border:1px solid var(--line);color:var(--txt);padding:11px 16px;border-radius:14px;font-size:14px;cursor:pointer}
.soon{display:inline-block;background:#f2c14e22;color:var(--gold);border:1px solid #f2c14e55;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:700;color:var(--gold);font-size:15px}
ol,ul{margin:10px 0 0 22px;color:#dde4fb;font-size:14.5px}
li{margin:5px 0}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all;color:var(--dim);margin-top:10px}
.note{margin-top:26px;font-size:13.5px;color:var(--dim);background:#ffffff0d;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
footer{margin-top:34px;text-align:center;color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#">
      <div class="logo"><svg viewBox="0 0 100 100"><path d="M26 80 L50 30 L74 80 M36 61 H64" fill="none" stroke="#f2c14e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 12 l3 7 8 .6-6 5 2 8-7-4.2-7 4.2 2-8-6-5 8-.6z" fill="#f2c14e"/></svg></div>
      <div><div class="bn">Alfaris Labs</div><div class="sub" id="tag"></div></div>
    </a>
    <div class="lang" id="lang"></div>
  </header>

  <section class="hero">
    <h1 id="h1"></h1>
    <p id="lead"></p>
  </section>

  <section class="grid" id="apps"></section>

  <div class="note" id="note"></div>

  <footer id="foot"></footer>
</div>

<script>
const T = {
  bn: {tag:"আন্তরিকতায় গড়া উপকারী অ্যাপ", h1:"আমাদের অ্যাপসমূহ", lead:"নিচের অ্যাপগুলো সরাসরি ডাউনলোড করে আপনার Android ফোনে ইনস্টল করুন। সম্পূর্ণ বিনামূল্যে।", dl:"ডাউনলোড (APK)", ver:"ভার্সন", upd:"হালনাগাদ", size:"আকার", soon:"শীঘ্রই আসছে", how:"কীভাবে ইনস্টল করবেন", new_:"এই ভার্সনে নতুন", sha:"ফাইল যাচাইয়ের SHA-256:", share:"লিংক শেয়ার", copied:"লিংক কপি হয়েছে ✓", need:"Android",
    steps:["উপরের \"ডাউনলোড\" বাটনে ট্যাপ করুন। ফাইলটি ফোনে নামবে।","ডাউনলোড শেষে ফাইলটি খুলুন। ফোন \"অজানা উৎস থেকে ইনস্টল\" অনুমতি চাইলে \"সেটিংস\" চেপে ব্রাউজারকে অনুমতি দিন।","\"ইনস্টল\" চাপুন। Google-এর সতর্কতা এলে \"তবুও ইনস্টল করুন\" (Install anyway) চাপুন।","অ্যাপ খুলে যে অনুমতি চায় (যেমন নোটিফিকেশন) সেটা দিন।"],
    note:"কেন সতর্কতা আসে? Play Store-এর বাইরে থেকে নামানো যেকোনো অ্যাপে Android এই বার্তা দেখায়। এটা ফোনের সাধারণ নিয়ম।",
    foot:"© 2026 Alfaris Labs · Saleh Ahmed · Bouaké, Côte d'Ivoire"},
  fr: {tag:"Des applications utiles, avec sincérité", h1:"Nos applications", lead:"Téléchargez et installez directement ces applications sur votre téléphone Android. Entièrement gratuit.", dl:"Télécharger (APK)", ver:"Version", upd:"Mise à jour", size:"Taille", soon:"Bientôt disponible", how:"Comment installer", new_:"Nouveautés", sha:"SHA-256 du fichier :", share:"Partager le lien", copied:"Lien copié ✓", need:"Android",
    steps:["Appuyez sur « Télécharger ». Le fichier s'enregistre sur votre téléphone.","Ouvrez le fichier. Si le téléphone demande l'autorisation « sources inconnues », appuyez sur « Paramètres » et autorisez le navigateur.","Appuyez sur « Installer ». Si un avertissement de Google apparaît, choisissez « Installer quand même ».","Ouvrez l'application et accordez les autorisations demandées (par ex. notifications)."],
    note:"Pourquoi cet avertissement ? Android l'affiche pour toute application téléchargée hors du Play Store. C'est une règle générale du téléphone.",
    foot:"© 2026 Alfaris Labs · Saleh Ahmed · Bouaké, Côte d'Ivoire"},
  en: {tag:"Useful apps, built with sincerity", h1:"Our apps", lead:"Download these apps directly and install them on your Android phone. Completely free.", dl:"Download (APK)", ver:"Version", upd:"Updated", size:"Size", soon:"Coming soon", how:"How to install", new_:"What's new", sha:"File SHA-256 for verification:", share:"Share link", copied:"Link copied ✓", need:"Android",
    steps:["Tap \"Download\". The file is saved to your phone.","Open the file. If the phone asks for the \"unknown sources\" permission, tap \"Settings\" and allow your browser.","Tap \"Install\". If a Google warning appears, choose \"Install anyway\".","Open the app and allow the permissions it asks for (e.g. notifications)."],
    note:"Why the warning? Android shows this for any app downloaded outside the Play Store. It is a general phone rule.",
    foot:"© 2026 Alfaris Labs · Saleh Ahmed · Bouaké, Côte d'Ivoire"}
};
let lang = localStorage.getItem("lang") || ((navigator.language||"bn").slice(0,2));
if(!T[lang]) lang = "bn";
let DATA = null;

function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("tag").textContent = t.tag;
  document.getElementById("h1").textContent = t.h1;
  document.getElementById("lead").textContent = t.lead;
  document.getElementById("note").textContent = t.note;
  document.getElementById("foot").textContent = t.foot;
  const lg = document.getElementById("lang"); lg.innerHTML = "";
  [["bn","বাংলা"],["fr","Français"],["en","English"]].forEach(([k,n])=>{
    const b = el("button", k===lang?"on":"", n);
    b.onclick = ()=>{lang=k;localStorage.setItem("lang",k);render()};
    lg.appendChild(b);
  });
  const box = document.getElementById("apps"); box.innerHTML = "";
  if(!DATA) return;
  DATA.apps.forEach(a=>{
    const c = el("article","card"); c.id = a.id;
    const ic = a.icon ? `<img src="${esc(a.icon)}" alt="">` : esc(a.emoji||"📱");
    let meta = "";
    if(a.status==="live") meta = `${t.ver} ${esc(a.version)} · ${esc(a.size)} · ${t.upd} ${esc(a.date)} · ${t.need} ${esc(a.android)}`;
    c.innerHTML = `<div class="top"><div class="ic">${ic}</div><div><h2>${esc(a.name[lang])}</h2><div class="meta">${meta}</div></div></div><p class="desc">${esc(a.tagline[lang])}</p>`;
    if(a.status==="live"){
      const row = el("div","btns");
      const d = el("a","dl","⬇ "+esc(t.dl)); d.href = a.file; d.setAttribute("download", a.id+"-v"+a.version+".apk");
      row.appendChild(d);
      const s = el("button","ghost","↗ "+esc(t.share));
      s.onclick = async ()=>{
        const url = location.origin + location.pathname + "#" + a.id;
        try{ if(navigator.share){await navigator.share({title:a.name[lang],url});return} }catch(e){}
        try{ await navigator.clipboard.writeText(url); s.textContent = t.copied }catch(e){ prompt("",url) }
      };
      row.appendChild(s);
      c.appendChild(row);
      const how = el("details",null,`<summary>${esc(t.how)}</summary><ol>${t.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`);
      c.appendChild(how);
      if(a.changes && a.changes[lang]){
        c.appendChild(el("details",null,`<summary>${esc(t.new_)} – ${esc(a.version)}</summary><ul>${a.changes[lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`));
      }
      c.appendChild(el("div","hash",`${esc(t.sha)}<br>${esc(a.sha256)}`));
    } else {
      c.appendChild(el("span","soon",esc(t.soon)));
    }
    box.appendChild(c);
  });
}

render();
fetch("apps.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{DATA=j;render();if(location.hash){const e=document.querySelector(location.hash);e&&e.scrollIntoView()}}).catch(()=>{});
</script>
</body>
</html>
