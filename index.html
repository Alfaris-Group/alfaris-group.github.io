*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans",sans-serif;color:var(--txt);background:var(--bg1);min-height:100vh;line-height:1.6;position:relative;overflow-x:hidden}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#0f3d3e,#1b6b5a);display:grid;place-items:center;box-shadow:0 6px 20px #0006}

.bn{font-weight:800;font-size:20px;color:var(--gold);letter-spacing:.2px;line-height:1.2}
.sub{font-size:12.5px;color:var(--dim)}

.lang button{background:transparent;border:0;color:var(--dim);padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit}

.lb .cnt{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-size:14px;pointer-events:none}
body.lock{overflow:hidden}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:700;color:var(--gold);font-size:15px;list-style-position:inside}

@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

  fr: {free:"Entièrement gratuit", dls:"téléchargements", verify:"Vérifier le fichier (SHA-256)", copy:"Copier", copied2:"Copié ✓", err:"Impossible de charger la liste. Vérifiez la connexion et actualisez la page.", load:"Chargement…", close:"Fermer", prev:"Précédent", next:"Suivant", apk:"Fichier APK", reg:"fr-FR", t1:"Téléchargement direct", t2:"Sans Play Store", t3:"বাংলা · Français · English", tag:"Des applications utiles, avec sincérité", h1:"Nos applications", lead:"Téléchargez et installez directement ces applications sur votre téléphone Android. Entièrement gratuit.", dl:"Télécharger (APK)", ver:"Version", upd:"Mise à jour", size:"Taille", shots:"Captures d'écran", soon:"Bientôt disponible", how:"Comment installer", new_:"Nouveautés", sha:"SHA-256 du fichier :", share:"Partager le lien", copied:"Lien copié ✓", need:"Android",

};
let lang = localStorage.getItem("lang") || ((navigator.language||"bn").slice(0,2));
if(!T[lang]) lang = "bn";
let DATA = null, FAILED = false;

function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function fmtDate(d,t){try{return new Date(d+"T00:00:00Z").toLocaleDateString(t.reg,{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"})}catch(e){return d}}
function pick(o,l){return o&&(o[l]||o.en||o.bn)||""}


const CNT_BASE="https://alfaris-counter.veloraci.workers.dev";
const COUNTS = {};
function fmtNum(n,t){try{return Number(n).toLocaleString(t.reg)}catch(e){return String(n)}}
function loadCount(id){
  fetch(CNT_BASE+"/get/"+encodeURIComponent(id)).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
    if(typeof j.value==="number"){COUNTS[id]=j.value;paintCount(id)}
  }).catch(()=>{});
}
function paintCount(id){
  const e=document.querySelector("#"+id+" .dlcount"); if(!e||COUNTS[id]==null)return;
  e.textContent="⬇ "+fmtNum(COUNTS[id],T[lang])+" "+T[lang].dls; e.hidden=false;
}
function countDownload(id){
  try{
    const k="dl_"+id, last=+localStorage.getItem(k)||0;
    if(Date.now()-last<600000) return;
    localStorage.setItem(k,Date.now());
  }catch(e){}
  fetch(CNT_BASE+"/hit/"+encodeURIComponent(id),{method:"POST",keepalive:true}).then(r=>r.ok?r.json():null).then(j=>{if(j&&typeof j.value==="number"){COUNTS[id]=j.value;paintCount(id)}}).catch(()=>{});
}

function openLb(screens,i,t){
  const n=screens.length; let k=i;
  const prevFocus=document.activeElement;
  const lb=el("div","lb"); lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true");
  const big=el("img"); big.alt=t.shots; const cnt=el("div","cnt");
  const pl=el("button","arr l","‹"), pr=el("button","arr r","›"), x=el("button","x","✕");
  pl.setAttribute("aria-label",t.prev); pr.setAttribute("aria-label",t.next); x.setAttribute("aria-label",t.close);
  const show=()=>{big.src=screens[k]; cnt.textContent=(k+1)+" / "+n; pl.hidden=pr.hidden=(n<2)};
  const go=d=>{k=(k+d+n)%n; show()};
  const close=()=>{lb.remove(); document.body.classList.remove("lock"); document.removeEventListener("keydown",key); prevFocus&&prevFocus.focus&&prevFocus.focus()};
  const key=e=>{if(e.key==="ArrowLeft")go(-1);else if(e.key==="ArrowRight")go(1);else if(e.key==="Escape")close()};
  pl.onclick=e=>{e.stopPropagation();go(-1)}; pr.onclick=e=>{e.stopPropagation();go(1)};
  x.onclick=e=>{e.stopPropagation();close()}; big.onclick=e=>e.stopPropagation();
  let x0=null; lb.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  lb.addEventListener("touchend",e=>{if(x0==null)return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>40)go(dx<0?1:-1)});
  lb.onclick=close; document.addEventListener("keydown",key);
  lb.append(big,pl,pr,x,cnt); document.body.appendChild(lb); document.body.classList.add("lock"); show(); x.focus();
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("tag").textContent = t.tag;
  document.getElementById("h1").textContent = t.h1;
  document.getElementById("lead").textContent = t.lead;
  document.getElementById("note").textContent = t.note;
  document.getElementById("foot").textContent = t.foot;
  document.getElementById("trust").innerHTML = [t.free,t.t1,t.t2,t.t3].map(x=>`<span>${esc(x)}</span>`).join("");
  const lg = document.getElementById("lang"); lg.innerHTML = "";
  [["bn","বাংলা"],["fr","Français"],["en","English"]].forEach(([k,n])=>{
    const b = el("button", k===lang?"on":"", n); b.setAttribute("aria-pressed",k===lang);
    b.onclick = ()=>{lang=k;localStorage.setItem("lang",k);render()};
    lg.appendChild(b);
  });
  const box = document.getElementById("apps"); box.innerHTML = "";
  if(FAILED){box.appendChild(el("div","msg",esc(t.err)));return}
  if(!DATA){box.appendChild(el("div","msg",esc(t.load)));return}
  DATA.apps.forEach(a=>{
    const c = el("article","card"); c.id = a.id;
    const ic = a.icon ? `<img src="${esc(a.icon)}" alt="" width="84" height="84">` : esc(a.emoji||"📱");
    let chips = "";
    const web = a.type==="web";
    if(a.status==="live" && web) chips = `<span class="chip g">${esc(t.free)}</span><span class="chip">${esc(t.ver)} ${esc(a.version)}</span><span class="chip g">${esc(t.web)}</span><span class="chip">${esc(t.all)}</span><span class="chip">${esc(t.upd)} ${esc(fmtDate(a.date,t))}</span><span class="chip g dlcount" hidden></span>`;
    else if(a.status==="live") chips = `<span class="chip g">${esc(t.free)}</span><span class="chip">${esc(t.ver)} ${esc(a.version)}</span><span class="chip">${esc(a.size)}</span><span class="chip">Android ${esc(a.android)}</span><span class="chip">${esc(t.upd)} ${esc(fmtDate(a.date,t))}</span><span class="chip g dlcount" hidden></span>`;
    c.innerHTML = `<div class="top"><div class="ic">${ic}</div><div><h2>${esc(pick(a.name,lang))}</h2><div class="chips">${chips}</div></div></div><p class="desc">${esc(pick(a.tagline,lang))}</p>`;
    if(a.screens && a.screens.length){
      const g = el("div","shots"); g.setAttribute("role","list"); g.setAttribute("aria-label", t.shots);
      const nS=a.screens.length;
      a.screens.forEach((u,i)=>{
        const tile=el("button","tile"); tile.type="button"; tile.setAttribute("role","listitem"); tile.setAttribute("aria-label",t.shots+" "+(i+1)+"/"+nS);
        const im=el("img"); im.src=u; im.loading="lazy"; im.alt=""; tile.appendChild(im);
        if(i===2&&nS>3) tile.appendChild(el("span","more m3","+"+(nS-3)));
        if(i===3&&nS>4) tile.appendChild(el("span","more m4","+"+(nS-4)));
        tile.onclick=()=>openLb(a.screens,i,t); g.appendChild(tile);
      });
      c.appendChild(g);
    }
    if(a.status==="live"){
      const row = el("div","btns");
      let d;
      if(web){ d = el("a","dl",`📲 ${esc(t.open)}`); d.href = a.url; }
      else { d = el("a","dl",`⬇ ${esc(t.dl)} <small>· ${esc(a.size)}</small>`); d.href = a.file; d.setAttribute("download", a.id+"-v"+a.version+".apk"); }
      d.addEventListener("click",()=>countDownload(a.id));
      row.appendChild(d);
      const s = el("button","ghost","↗ "+esc(t.share)); s.type="button";
      s.onclick = async ()=>{
        const url = location.origin + location.pathname + "#" + a.id;
        try{ if(navigator.share){await navigator.share({title:pick(a.name,lang),url});return} }catch(e){ if(e&&e.name==="AbortError")return }
        try{ await navigator.clipboard.writeText(url); s.textContent = t.copied; setTimeout(()=>{s.textContent="↗ "+t.share},2500) }catch(e){ prompt("",url) }
      };
      row.appendChild(s);
      c.appendChild(row);
      c.appendChild(el("details",null,`<summary>${esc(t.how)}</summary><ol>${(web?t.wsteps:t.steps).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`));
      if(a.changes && (a.changes[lang]||a.changes.en)){
        c.appendChild(el("details",null,`<summary>${esc(t.new_)} – ${esc(a.version)}</summary><ul>${(a.changes[lang]||a.changes.en).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`));
      }
      if(a.sha256){
      const dv = el("details",null,`<summary>${esc(t.verify)}</summary><div class="hrow"><div class="hash">${esc(a.sha256)}</div></div>`);
      const cb = el("button","ghost",esc(t.copy)); cb.type="button";
      cb.onclick=async()=>{try{await navigator.clipboard.writeText(a.sha256);cb.textContent=t.copied2;setTimeout(()=>{cb.textContent=t.copy},2000)}catch(e){}};
      dv.querySelector(".hrow").appendChild(cb);
      c.appendChild(dv);
      }
    } else {
      c.appendChild(el("span","soon",esc(t.soon)));
    }
    box.appendChild(c);
    if(a.status==="live"){ if(COUNTS[a.id]!=null) paintCount(a.id); else loadCount(a.id); }
  });
}

render();
fetch("apps.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{DATA=j;render();if(location.hash){try{const e=document.querySelector(location.hash);e&&e.scrollIntoView()}catch(_){}}}).catch(()=>{FAILED=true;render()});
</script>
</body>
</html>
