<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Sarraf – Smart Currency Converter</title>
<meta name="description" content="Sarraf by Alfaris Labs — smart currency converter: BDT, CFA, USD, EUR and more. Works offline.">
<meta name="theme-color" content="#0B0C0F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0B0C0F; --card:#17191E; --card2:#1F2228; --line:#2A2E36; --text:#F3F4F6; --muted:#9097A3; --dim:#646B77;
  --gold:#E9B44C; --gold2:#C98F2E; --gold-soft:rgba(233,180,76,.14); --green:#34C27A; --red:#F0606A; --blue:#5B8CFF;
  --shadow:0 10px 30px rgba(0,0,0,.35); --r:22px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="light"]{
  --bg:#F4F2EE; --card:#FFFFFF; --card2:#F1EEE8; --line:#E3DED5; --text:#17181B; --muted:#6B6F78; --dim:#9A9EA6;
  --gold:#B97F14; --gold2:#9A6608; --gold-soft:rgba(185,127,20,.12); --shadow:0 8px 24px rgba(40,30,10,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Hind Siliguri",sans-serif;overscroll-behavior-y:none}
body{min-height:100vh;padding-top:var(--safe-t)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text)}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(110px + var(--safe-b));}
/* header */
.top{display:flex;align-items:center;gap:12px;padding:14px 2px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:20}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:38px;height:38px;border-radius:11px}
.brand b{font-size:20px;letter-spacing:.3px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* views */
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:22px;margin:8px 4px 14px}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px}
.muted{color:var(--muted)} .small{font-size:13px}
/* rows */
.rows{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.row{background:var(--card);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:12px;position:relative;transition:box-shadow .2s, background .2s;min-height:96px}
.row.base{box-shadow:inset 0 0 0 1.5px var(--gold);background:linear-gradient(135deg,var(--card),var(--card2))}
.row .lbl{position:absolute;top:10px;left:18px;font-size:12px;color:var(--muted)}
.row.base .lbl{color:var(--gold)}
.cur{display:flex;align-items:center;gap:10px;flex:none;padding:14px 0 0}
.flag{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none;line-height:1}
.flag.txt{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.2px}
.code{font-size:21px;font-weight:650;display:flex;align-items:center;gap:4px}
.code svg{width:16px;height:16px;opacity:.7}
.amt{flex:1;text-align:right;min-width:0;padding-top:14px}
.amt .v{font-size:28px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.amt .v.long{font-size:22px}
.amt .r{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt .eq{font-size:14px;color:var(--gold);margin-top:2px}
.caret{display:inline-block;width:2px;height:26px;background:var(--gold);vertical-align:-4px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.edit-tools{display:none;gap:6px;flex:none}
.editing .edit-tools{display:flex}
.editing .amt{display:none}
.tool{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:16px}
.tool.del{color:var(--red)}
.list-actions{display:flex;justify-content:center;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.pill{padding:10px 16px;border-radius:999px;background:var(--card);font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-size:14px;border:1px solid var(--line)}
.chip.on{background:var(--gold);color:#1a1205;border-color:var(--gold);font-weight:600}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:14px 4px 4px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:var(--red)} .dot.old{background:var(--gold)}
.status .sp{flex:1}
.words{margin-top:14px}
.words summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:600}
.words summary::-webkit-details-marker{display:none}
.wline{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
.wline:first-of-type{margin-top:10px}
.wline b{color:var(--gold);font-size:12px;display:block;letter-spacing:.4px}
.peg{font-size:12px;color:var(--dim);margin:10px 4px 0;text-align:center}
/* keypad */
.keypad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);padding:10px 12px calc(12px + var(--safe-b));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.keypad.on{transform:none}
.kp-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kp-top .chips{flex:1}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:56px;border-radius:16px;background:var(--card2);font-size:23px;font-weight:550;display:grid;place-items:center;user-select:none;transition:transform .06s,background .15s}
.key:active{transform:scale(.95);background:var(--line)}
.key.op{color:var(--gold);font-size:26px}
.key.fn{color:var(--muted);font-size:19px}
.key.ok{background:var(--gold);color:#1a1205;font-size:24px}
.key svg{width:24px;height:24px}
/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));z-index:30;display:flex;gap:6px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:6px;border-radius:999px;box-shadow:var(--shadow);border:1px solid var(--line);width:min(calc(100% - 24px),536px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:999px;font-size:11.5px;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button.on{background:var(--card2);color:var(--text)}
.nav button.on svg{color:var(--gold)}
/* modal sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:26px 26px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;padding-bottom:var(--safe-b)}
.sheet.on{transform:none}
.sheet-h{padding:12px 18px 8px;display:flex;align-items:center;gap:10px}
.sheet-h h3{margin:0;font-size:18px;flex:1}
.sheet-b{overflow:auto;padding:4px 16px 20px}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:none;font-size:16px}
.search:focus{border-color:var(--gold)}
.sec-t{font-size:12.5px;color:var(--muted);margin:16px 4px 6px;text-transform:uppercase;letter-spacing:.6px}
.citem{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:14px;width:100%;text-align:left}
.citem:active{background:var(--card)}
.citem .n{flex:1;min-width:0}
.citem .n b{display:block;font-size:16px}
.citem .n span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .chk{color:var(--gold);font-size:18px}
/* forms */
.field{margin:12px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 4px 6px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:none;font-size:16px}
.inp:focus{border-color:var(--gold)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn{width:100%;padding:14px;border-radius:16px;background:var(--gold);color:#1a1205;font-weight:650;font-size:16px;margin-top:8px}
.btn.ghost{background:var(--card);color:var(--text)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.curbtn{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px 12px;font-weight:600;font-size:17px;flex:1}
.pair{display:flex;align-items:center;gap:10px}
.pair .flag{width:30px;height:30px;font-size:20px}
.pair .flag.txt{font-size:9px}
.swap{width:44px;height:44px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:none}
.swap svg{width:20px;height:20px}
/* chart */
.bigrate{font-size:34px;font-weight:700;margin:14px 2px 2px;font-variant-numeric:tabular-nums}
.chg{font-size:14px;font-weight:600}
.chg.up{color:var(--green)} .chg.dn{color:var(--red)}
.chart-box{position:relative;margin-top:14px;height:220px}
.chart-box svg{width:100%;height:100%;display:block;touch-action:none}
.tip{position:absolute;top:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;pointer-events:none;white-space:nowrap;transform:translateX(-50%);display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:16px;padding:12px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
.ranges{margin-top:16px}
.center-msg{display:grid;place-items:center;height:100%;color:var(--muted);font-size:14px;text-align:center;padding:20px}
/* remit */
.res{margin-top:12px;background:var(--card);border-radius:20px;padding:15px 16px;position:relative}
.res.best{box-shadow:inset 0 0 0 1.5px var(--green)}
.res .hd{display:flex;align-items:center;gap:8px}
.res .hd b{flex:1;font-size:16px}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(52,194,122,.15);color:var(--green);font-weight:600}
.badge.ex{background:var(--gold-soft);color:var(--gold)}
.res .big{font-size:26px;font-weight:700;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.res .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.res .loss{color:var(--red)}
.res .acts{display:flex;gap:6px}
.res .acts button{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.res .acts svg{width:15px;height:15px}
.bigin{font-size:28px;font-weight:700;text-align:right;padding:12px 14px}
.tipbox{margin-top:14px;font-size:13px;color:var(--muted);background:var(--card);border-radius:16px;padding:12px 14px;line-height:1.55}
/* more */
.menu{display:flex;flex-direction:column;gap:10px}
.mitem{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:15px 16px;text-align:left;width:100%}
.mitem .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);flex:none}
.mitem .ic svg{width:22px;height:22px}
.mitem .t{flex:1}
.mitem .t b{display:block;font-size:16px}
.mitem .t span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.mitem .ar{color:var(--dim)}
.sub{display:none}
.sub.on{display:block;animation:fade .2s ease}
.backrow{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.backrow h2{margin:0;font-size:20px}
.gtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.gtable th,.gtable td{padding:11px 6px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
.gtable th{color:var(--muted);font-weight:500;font-size:12px}
.gtable td:first-child,.gtable th:first-child{text-align:left}
.gtable td:first-child{font-weight:600;color:var(--gold)}
.aitem,.hitem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:13px 14px;margin-bottom:10px}
.aitem .n,.hitem .n{flex:1;min-width:0}
.aitem .n b,.hitem .n b{display:block;font-size:15px}
.aitem .n span,.hitem .n span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--gold)}
.switch.on::after{transform:translateX(18px)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow > span{font-size:15px}
.setrow select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-width:58%}
.about-hero{text-align:center;padding:10px 0 6px}
.about-hero img{width:96px;height:96px;border-radius:26px;box-shadow:var(--shadow)}
.about-hero h3{margin:14px 0 2px;font-size:24px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:90;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.banner{background:var(--gold-soft);color:var(--gold);border-radius:16px;padding:12px 14px;font-size:13.5px;margin:4px 0 12px;display:flex;gap:10px;align-items:center}
.banner button{margin-left:auto;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" alt="">
      <div style="min-width:0"><b>Sarraf</b><small data-t="appSub"></small></div>
    </div>
    <button class="icon-btn" id="btnShare" aria-label="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    <button class="icon-btn" id="btnRefresh" aria-label="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  </header>

  <div id="installBanner" class="banner" style="display:none"><span data-t="installHint"></span><button id="btnInstallBanner" data-t="install"></button></div>
  <div id="alertBanner" class="banner" style="display:none"></div>

  <!-- CONVERT -->
  <section class="view on" id="v-convert">
    <div class="rows" id="rows"></div>
    <div class="list-actions">
      <button class="pill gold" id="btnAdd"><span data-t="addCurrency"></span></button>
      <button class="pill" id="btnArrange"><span data-t="arrange"></span></button>
      <button class="pill" id="btnSave">★ <span data-t="save"></span></button>
    </div>
    <div class="chips" id="quickChips"></div>
    <div class="status" id="status"></div>
    <details class="card words" id="wordsCard" open>
      <summary><span data-t="inWords"></span><span class="muted">▾</span></summary>
      <div id="wordsBody"></div>
    </details>
    <div class="peg" data-t="pegNote"></div>
  </section>

  <!-- CHART -->
  <section class="view" id="v-chart">
    <h2 data-t="chartTitle"></h2>
    <div class="pair">
      <button class="curbtn" id="chFrom"></button>
      <button class="swap" id="chSwap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></svg></button>
      <button class="curbtn" id="chTo"></button>
    </div>
    <div class="bigrate" id="chRate">–</div>
    <div class="chg" id="chChg">&nbsp;</div>
    <div class="seg ranges" id="chRanges"></div>
    <div class="card" style="margin-top:14px;padding:12px 10px">
      <div class="chart-box" id="chartBox"><div class="center-msg" data-t="loading"></div></div>
    </div>
    <div class="stats" id="chStats"></div>
  </section>

  <!-- REMIT -->
  <section class="view" id="v-remit">
    <h2 data-t="remitTitle"></h2>
    <div class="pair">
      <button class="curbtn" id="rmFrom"></button>
      <button class="swap" id="rmSwap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></svg></button>
      <button class="curbtn" id="rmTo"></button>
    </div>
    <div class="seg" id="rmMode" style="margin-top:12px">
      <button data-m="send" data-t="modeSend"></button>
      <button data-m="recv" data-t="modeRecv"></button>
    </div>
    <div class="field">
      <label id="rmAmtLbl"></label>
      <input class="inp bigin" id="rmAmt" inputmode="decimal" autocomplete="off">
    </div>
    <div class="chips" id="rmChips"></div>
    <div id="rmResults"></div>
    <button class="btn ghost" id="btnAddProv" style="margin-top:14px">+ <span data-t="addProvider"></span></button>
    <div class="tipbox" data-t="remitTip"></div>
  </section>

  <!-- MORE -->
  <section class="view" id="v-more">
    <div class="sub on" id="s-menu">
      <h2 data-t="navMore"></h2>
      <div class="menu">

function evalExpr(src){
  const s = String(src).replace(/[×x]/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,"").replace(/\s/g,"").replace(/[+\-*/]+$/,"");
  if (!s) return NaN;
  let i = 0;
  const peek = () => s[i];
  function num(){
    let st = i; while (i < s.length && /[0-9.]/.test(s[i])) i++;
    if (st === i) throw 0;
    const v = parseFloat(s.slice(st, i)); if (!isFinite(v)) throw 0; return v;
  }
  function factor(){
    let neg = false; while (peek() === "-") { neg = !neg; i++; }
    let v;
    if (peek() === "(") { i++; v = expr().v; if (peek() === ")") i++; }
    else v = num();
    let pct = false;
    if (peek() === "%") { i++; v = v / 100; pct = true; }
    return {v: neg ? -v : v, pct};
  }
  function term(){
    let f = factor(), v = f.v, pct = f.pct;
    while (peek() === "*" || peek() === "/") { const op = s[i++]; const g = factor(); v = op === "*" ? v * g.v : v / g.v; pct = false; }
    return {v, pct};
  }
  function expr(){
    let a = term().v;
    while (peek() === "+" || peek() === "-") {
      const op = s[i++]; const b = term();
      const bv = b.pct ? a * b.v : b.v;
      a = op === "+" ? a + bv : a - bv;
    }
    return {v:a};
  }
  try { const r = expr().v; if (i < s.length) return NaN; return r; } catch(e){ return NaN; }
}

function press(k){
  let e = S.expr;

    if (fresh) e = k === "00" ? "0" : k;
    else if (seg === "0") e = e.slice(0, -1) + (k === "00" ? "0" : k);
    else if (lastCh === "%") e += "*" + k;

    <text x="${P}" y="${H-5}" font-size="10" fill="var(--muted)">${esc(lab(pts[0].d))}</text>
    <text x="${W-P}" y="${H-5}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(lab(pts[pts.length-1].d))}</text>
    <line id="chCross" y1="10" y2="${H-22}" stroke="var(--muted)" stroke-width="1" style="display:none" vector-effect="non-scaling-stroke"/>
    <circle id="chDot" r="4.5" fill="${color}" stroke="var(--card)" stroke-width="2" style="display:none"/>
  </svg><div class="tip" id="chTip"></div>`;
  const svg = $("#chSvg"), tip = $("#chTip"), dot = $("#chDot"), cross = $("#chCross");
  const move = e => {
    const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * W;
    let i = Math.round((x - P) / ((W - 2*P) / (pts.length - 1))); i = Math.max(0, Math.min(pts.length - 1, i));
    const p = pts[i];
    dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(p.v)); dot.style.display = "";
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.style.display = "";
    tip.style.display = "block"; tip.style.left = (X(i) / W * r.width) + "px";
    tip.textContent = toBnDigits(`${lab(p.d)} · ${fmt(p.v, b, {rate:1})}`);
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; dot.style.display = "none"; cross.style.display = "none"; });
}

/* ================= REMIT ================= */
function provRate(p, a, b){
  const mid = rate(a, b);
  if (p.type === "rate") { if (p.a === a && p.b === b) return p.value; if (p.a === b && p.b === a) return 1 / p.value; return NaN; }
  return mid * (1 - (p.value || 0) / 100);
}
function renderRemit(){
  const {a, b, mode} = S.remit;
  $("#rmFrom").innerHTML = flagHTML(a) + a; $("#rmTo").innerHTML = flagHTML(b) + b;
  $$("#rmMode button").forEach(x => x.classList.toggle("on", x.dataset.m === mode));
  const inCur = mode === "send" ? a : b;
  $("#rmAmtLbl").textContent = (mode === "send" ? t("youSend") : t("theyGet")) + ` (${inCur})`;
  const inp = $("#rmAmt"); if (document.activeElement !== inp) inp.value = S.remit.amt;
  $("#rmChips").innerHTML = quickAmounts(inCur).map(v => `<button class="chip" data-rq="${v}">${toBnDigits(fmtInt(v))}</button>`).join("");
  renderRemitResults();
}
function renderRemitResults(){
  const {a, b, mode} = S.remit;
  const X = evalExpr(S.remit.amt), mid = rate(a, b);
  const el = $("#rmResults");
  if (!isFinite(X) || X <= 0 || !isFinite(mid)) { el.innerHTML = ""; return; }
  const midOut = mode === "send" ? X * mid : X / mid;
  const outCur = mode === "send" ? b : a;
  let html = `<div class="res"><div class="hd"><b>${t("midRef")}</b></div>
    <div class="big">${toBnDigits(fmt(midOut, outCur))} ${outCur}</div>
    <div class="meta"><span>${mode === "send" ? t("recvGets") : t("youNeed")}</span><span>1 ${a} = ${toBnDigits(fmt(mid, b, {rate:1}))} ${b}</span></div>
    <div class="meta" style="margin-top:6px">${esc(amountWords(midOut, outCur))}</div></div>`;
  const rows = S.providers.map(p => {
    const r = provRate(p, a, b); if (!isFinite(r) || r <= 0) return null;
    const fee = +p.fee || 0;
    let out, diff;
    if (mode === "send") { out = Math.max(0, (X - fee) * r); diff = midOut - out; }
    else { out = X / r + fee; diff = out - midOut; }
    return {p, r, fee, out, diff};
  }).filter(Boolean);
  rows.sort((x, y) => mode === "send" ? y.out - x.out : x.out - y.out);
  rows.forEach((x, i) => {
    const pct = midOut ? Math.abs(x.diff) / midOut * 100 : 0;
    html += `<div class="res${i === 0 && rows.length > 1 ? " best" : ""}">
      <div class="hd"><b>${esc(x.p.name)}</b>${i === 0 && rows.length > 1 ? `<span class="badge">${t("best")}</span>` : ""}${x.p.ex ? `<span class="badge ex">${t("example")}</span>` : ""}
      <span class="acts"><button data-pe="${x.p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></span></div>
      <div class="big">${toBnDigits(fmt(x.out, outCur))} ${outCur}</div>
      <div class="meta"><span>${t("effRate")}: ${toBnDigits(fmt(x.r, b, {rate:1}))}</span><span>${t("fee")}: ${toBnDigits(fmt(x.fee, a))} ${a}</span></div>
      <div class="meta" style="margin-top:4px"><span class="loss">${toBnDigits(fmt(Math.abs(x.diff), outCur))} ${outCur} (${toBnDigits(pct.toFixed(1))}%) ${mode === "send" ? t("loss") : t("extra")}</span></div>
    </div>`;
  });
  el.innerHTML = html;
}
$("#rmAmt").addEventListener("input", e => { S.remit.amt = e.target.value.replace(/[^\d.+\-*/%]/g, ""); save(); renderRemitResults(); });
$("#rmChips").onclick = e => { const b = e.target.closest("[data-rq]"); if (!b) return; S.remit.amt = b.dataset.rq; $("#rmAmt").value = b.dataset.rq; save(); renderRemitResults(); };

$("#rmFrom").onclick = () => openPicker(c => { S.remit.a = c; save(); renderRemit(); }, S.remit.a);
$("#rmTo").onclick = () => openPicker(c => { S.remit.b = c; save(); renderRemit(); }, S.remit.b);

function provForm(p){
  const {a, b} = S.remit;
  const isNew = !p; p = p ? {...p} : {id:"p" + Date.now(), name:"", type:"rate", value:"", fee:0, a, b};
  if (p.type === "rate" && !p.value) p.value = +rate(a, b).toFixed(4);
  openSheet(isNew ? t("addProvider") : t("editProv"), `
    <div class="field"><label>${t("provName")}</label><input class="inp" id="pfName" value="${esc(p.name)}"></div>
    <div class="field"><label>${t("provType")}</label><div class="seg" id="pfType"><button data-ty="rate">${t("typeRate")}</button><button data-ty="margin">${t("typeMargin")}</button></div></div>
    <div class="field"><label id="pfValLbl"></label><input class="inp" id="pfVal" inputmode="decimal" value="${esc(p.value)}"></div>
    <div class="field"><label>${t("feeLbl",{c:a})}</label><input class="inp" id="pfFee" inputmode="decimal" value="${esc(p.fee)}"></div>
    <button class="btn" id="pfSave">${t("save")}</button>
    ${isNew ? "" : `<button class="btn danger" id="pfDel">${t("del")}</button>`}`);
  const setType = ty => { p.type = ty; $$("#pfType button").forEach(x => x.classList.toggle("on", x.dataset.ty === ty)); $("#pfValLbl").textContent = ty === "rate" ? t("rateFor",{a:S.remit.a,b:S.remit.b}) : t("marginPct"); };
  setType(p.type);
  $("#pfType").onclick = e => { const bt = e.target.closest("[data-ty]"); if (!bt) return; setType(bt.dataset.ty); $("#pfVal").value = bt.dataset.ty === "rate" ? +rate(S.remit.a, S.remit.b).toFixed(4) : 2; };
  $("#pfSave").onclick = () => {
    const v = parseFloat($("#pfVal").value), f = parseFloat($("#pfFee").value || "0");
    if (!isFinite(v) || v < 0 || !isFinite(f)) { toast(t("invalid")); return; }
    Object.assign(p, {name:$("#pfName").value.trim() || "—", value:v, fee:f, ex:false});
    if (p.type === "rate") { p.a = S.remit.a; p.b = S.remit.b; }
    const i = S.providers.findIndex(x => x.id === p.id); if (i >= 0) S.providers[i] = p; else S.providers.push(p);
    save(); closeSheet(); renderRemit();
  };
  if (!isNew) $("#pfDel").onclick = () => { S.providers = S.providers.filter(x => x.id !== p.id); save(); closeSheet(); renderRemit(); };
}

/* ================= GOLD ================= */
const VORI = 11.664, OZ = 31.1034768;
async function renderGold(){
  $("#goldCur").innerHTML = ["BDT","XOF","USD"].map(c => `<button data-gc="${c}" class="${S.goldCur === c ? "on" : ""}">${c}</button>`).join("");
  const body = $("#goldBody");
  if (!R.rates.XAU) { body.innerHTML = `<div class="empty">${t("loading")}</div>`; try { const f = await fawaz("latest"); for (const k of ["XAU","XAG"]) if (f.rates[k]) R.rates[k] = f.rates[k]; localStorage.setItem(LR, JSON.stringify(R)); } catch(e){} }
  if (!R.rates.XAU) { body.innerHTML = `<div class="empty">${t("goldErr")}</div>`; return; }
  const c = S.goldCur, toC = rate("USD", c);
  const usdOz = 1 / R.rates.XAU, gGram = usdOz / OZ * toC;
  const rows = [["24K",1],["22K",22/24],["21K",21/24],["18K",18/24]];
  let h = `<table class="gtable"><tr><th>${S.lang === "bn" ? "ক্যারেট" : S.lang === "fr" ? "Carat" : "Karat"}</th><th>${t("perVori")}</th><th>${t("perGram")}</th></tr>`;
  rows.forEach(([k, f]) => h += `<tr><td>${k}</td><td>${toBnDigits(fmt(gGram * f * VORI, c))}</td><td>${toBnDigits(fmt(gGram * f, c))}</td></tr>`);
  if (R.rates.XAG) { const sGram = 1 / R.rates.XAG / OZ * toC; h += `<tr><td style="color:var(--muted)">${t("silver")}</td><td>${toBnDigits(fmt(sGram * VORI, c))}</td><td>${toBnDigits(fmt(sGram, c))}</td></tr>`; }
  h += `</table><div class="muted small" style="margin-top:10px">1 oz 24K = ${toBnDigits(fmt(usdOz * toC, c))} ${c}</div>`;
  body.innerHTML = h;
}
$("#goldCur").onclick = e => { const b = e.target.closest("[data-gc]"); if (!b) return; S.goldCur = b.dataset.gc; save(); renderGold(); };

/* ================= ALERTS ================= */
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open("sarraf", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v){ try { const db = await idb(); await new Promise(r => { const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = r; tx.onerror = r; }); } catch(e){} }
async function idbGet(k){ try { const db = await idb(); return await new Promise(r => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch(e){ return null; } }
function syncAlerts(){ S.alertsTs = Date.now(); save(); idbSet("alerts", {ts:S.alertsTs, list:S.alerts, lang:S.lang}); }
async function notify(title, body){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try { const reg = await navigator.serviceWorker?.ready; if (reg) { reg.showNotification(title, {body, icon:"icon-192.png", badge:"icon-192.png", tag:"sarraf-alert-" + Date.now()}); return; } } catch(e){}
  try { new Notification(title, {body, icon:"icon-192.png"}); } catch(e){}
}
function checkAlerts(){
  if (R.src === "builtin") return;
  let hit = [];
  S.alerts.forEach(al => {
    if (!al.on) return;
    const r = rate(al.a, al.b); if (!isFinite(r)) return;
    if ((al.cond === "above" && r >= al.v) || (al.cond === "below" && r <= al.v)) {
      al.on = false; al.hitAt = Date.now(); al.hitRate = r;
      const msg = `1 ${al.a} = ${fmt(r, al.b, {rate:1})} ${al.b} (${al.cond === "above" ? "≥" : "≤"} ${al.v})`;
      hit.push(msg); notify("💱 " + t("alertHit"), msg);
    }
  });
  if (hit.length) { syncAlerts(); const bn = $("#alertBanner"); bn.innerHTML = `🔔 <span>${esc(hit.join(" · "))}</span><button onclick="this.parentNode.style.display='none'">✕</button>`; bn.style.display = "flex"; }
}
function renderAlerts(){
  const nb = $("#btnNotif");
  const perm = "Notification" in window ? Notification.permission : "denied";
  nb.textContent = perm === "granted" ? t("notifOn") : perm === "denied" ? t("notifDenied") : t("notifEnable");
  nb.disabled = perm !== "default";
  const el = $("#alertList");
  if (!S.alerts.length) { el.innerHTML = `<div class="empty">${t("noAlerts")}</div>`; return; }
  el.innerHTML = S.alerts.map((al, i) => {
    const cur = rate(al.a, al.b);
    return `<div class="aitem"><div class="n"><b>1 ${al.a} ${al.cond === "above" ? "≥" : "≤"} ${toBnDigits(al.v)} ${al.b}</b><span>${t("current")}: ${toBnDigits(fmt(cur, al.b, {rate:1}))} ${al.b}${al.hitAt ? " · 🔔 " + esc(ago(al.hitAt)) : ""}</span></div>
      <button class="switch${al.on ? " on" : ""}" data-at="${i}"></button><button class="tool del" data-ad="${i}">✕</button></div>`;
  }).join("");
}
$("#alertList").onclick = e => {
  const tg = e.target.closest("[data-at]"), d = e.target.closest("[data-ad]");
  if (tg) { const al = S.alerts[+tg.dataset.at]; al.on = !al.on; if (al.on) { delete al.hitAt; } syncAlerts(); renderAlerts(); checkAlerts(); }
  if (d) { S.alerts.splice(+d.dataset.ad, 1); syncAlerts(); renderAlerts(); }
};
$("#btnNotif").onclick = async () => { if ("Notification" in window) { await Notification.requestPermission(); renderAlerts(); registerPeriodic(); } };
$("#btnAddAlert").onclick = () => {
  const f = {a:"USD", b:"BDT", cond:"above"};
  const draw = () => {
    const cur = rate(f.a, f.b);
    openSheet(t("addAlert"), `
      <div class="pair"><button class="curbtn" id="afA">${flagHTML(f.a)}${f.a}</button><span class="muted">→</span><button class="curbtn" id="afB">${flagHTML(f.b)}${f.b}</button></div>
      <div class="muted small" style="margin:10px 4px">${t("current")}: 1 ${f.a} = ${toBnDigits(fmt(cur, f.b, {rate:1}))} ${f.b}</div>
      <div class="field"><label>${t("when")}</label><div class="seg" id="afC"><button data-c="above">${t("above")}</button><button data-c="below">${t("below")}</button></div></div>
      <div class="field"><label>${t("target")} (${f.b})</label><input class="inp" id="afV" inputmode="decimal" value="${isFinite(cur) ? +(cur * (f.cond === "above" ? 1.01 : 0.99)).toPrecision(6) : ""}"></div>
      <button class="btn" id="afSave">${t("save")}</button>`);
    $$("#afC button").forEach(x => x.classList.toggle("on", x.dataset.c === f.cond));
    $("#afC").onclick = e => { const b = e.target.closest("[data-c]"); if (b) { f.cond = b.dataset.c; draw(); } };
    $("#afA").onclick = () => openPicker(c => { f.a = c; draw(); }, f.a);
    $("#afB").onclick = () => openPicker(c => { f.b = c; draw(); }, f.b);
    $("#afSave").onclick = async () => {
      const v = parseFloat($("#afV").value); if (!isFinite(v) || v <= 0) { toast(t("invalid")); return; }
      S.alerts.push({id:Date.now(), a:f.a, b:f.b, cond:f.cond, v, on:true}); syncAlerts(); closeSheet(); renderAlerts(); toast(t("alertSet"));
      if ("Notification" in window && Notification.permission === "default") { await Notification.requestPermission(); renderAlerts(); }
      registerPeriodic(); checkAlerts();
    };
  };
  draw();
};
async function registerPeriodic(){
  try {
    const reg = await navigator.serviceWorker?.ready; if (!reg || !reg.periodicSync) return;
    const st = await navigator.permissions.query({name:"periodic-background-sync"});
    if (st.state === "granted") await reg.periodicSync.register("sarraf-rates", {minInterval: 4 * 3600 * 1000});
  } catch(e){}
}

/* ================= INSTALL / SW ================= */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  $("#btnInstall").style.display = "";
  if (!localStorage.getItem("sarraf.installDismiss")) $("#installBanner").style.display = "flex";

async function doInstall(){ if (!deferredPrompt) return; deferredPrompt.prompt(); const r = await deferredPrompt.userChoice; if (r.outcome === "accepted") toast(t("installed")); deferredPrompt = null; $("#btnInstall").style.display = "none"; $("#installBanner").style.display = "none"; localStorage.setItem("sarraf.installDismiss", "1"); }

  navigator.serviceWorker.register("sw.js").then(() => registerPeriodic()).catch(() => {});
  navigator.serviceWorker.addEventListener?.("message", e => { if (e.data && e.data.type === "alerts") loadIdbAlerts(); });
}
async function loadIdbAlerts(){ const d = await idbGet("alerts"); if (d && d.ts > (S.alertsTs || 0)) { S.alerts = d.list; S.alertsTs = d.ts; save(); if (view === "more" && sub === "alerts") renderAlerts(); } }

if (!S.list.includes(S.base)) S.base = S.list[0];
renderAll();
loadIdbAlerts().then(() => idbSet("alerts", {ts:S.alertsTs, list:S.alerts, lang:S.lang}));
checkAlerts();
if (navigator.onLine && (S.auto || R.src === "builtin" || Date.now() - (R.fetched || 0) > 6 * 3600 * 1000)) refreshRates(false);
setInterval(() => { if (navigator.onLine && Date.now() - (R.fetched || 0) > 3 * 3600 * 1000) refreshRates(false); else renderStatus(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && navigator.onLine && Date.now() - (R.fetched || 0) > 3600 * 1000) refreshRates(false); });
window.__sarraf = {evalExpr, bnWords, enWords, frWords, amountWords, rate, S};
